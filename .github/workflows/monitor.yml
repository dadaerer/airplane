name: Flight Radar

on:
  schedule:
    - cron: "10 0 * * *"    # 北京时间 08:10
    - cron: "10 12 * * *"   # 北京时间 20:10
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flight-radar
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SERVERCHAN_SEND_KEY: ${{ secrets.SERVERCHAN_SEND_KEY }}
        run: python monitor.py

      - name: Commit data & report
        run: |
          git config user.name "flight-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
